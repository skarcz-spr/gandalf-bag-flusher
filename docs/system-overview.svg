<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">System overview – electronics</text>

  <!-- Legend -->
  <g font-size="12" fill="#333">
    <line x1="40" y1="610" x2="70" y2="610" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="78" y="614">GPIO signal</text>
    <line x1="180" y1="610" x2="210" y2="610" stroke="#2471a3" stroke-width="3"/><text x="218" y="614">I2C bus (GP4 SDA / GP5 SCL)</text>
    <line x1="420" y1="610" x2="450" y2="610" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/><text x="458" y="614">12 V power</text>
  </g>

  <!-- Inputs -->
  <text x="110" y="82" text-anchor="middle" font-weight="bold" fill="#555">INPUTS (active low, pull-up)</text>
  <g>
    <rect x="30" y="98" width="160" height="62" rx="8" fill="#eef3f8" stroke="#5d6d7e"/>
    <text x="110" y="122" text-anchor="middle" font-weight="bold">Rotary encoder</text>
    <text x="110" y="141" text-anchor="middle" font-size="11.5">CLK GP3 · DT GP6</text>
    <text x="110" y="155" text-anchor="middle" font-size="11.5">button GP7</text>

    <rect x="30" y="176" width="160" height="40" rx="8" fill="#eef3f8" stroke="#5d6d7e"/>
    <text x="110" y="201" text-anchor="middle"><tspan font-weight="bold">START</tspan> – GP1</text>

    <rect x="30" y="230" width="160" height="52" rx="8" fill="#eef3f8" stroke="#5d6d7e"/>
    <text x="110" y="252" text-anchor="middle"><tspan font-weight="bold">STOP</tspan> – GP2</text>
    <text x="110" y="270" text-anchor="middle" font-size="11">held at power-up = test mode</text>

    <rect x="30" y="296" width="160" height="40" rx="8" fill="#eef3f8" stroke="#5d6d7e"/>
    <text x="110" y="321" text-anchor="middle"><tspan font-weight="bold">Manual fill</tspan> – GP17</text>

    <rect x="30" y="350" width="160" height="40" rx="8" fill="#eef3f8" stroke="#5d6d7e"/>
    <text x="110" y="375" text-anchor="middle"><tspan font-weight="bold">Manual empty</tspan> – GP16</text>
  </g>
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="190" y1="129" x2="370" y2="200" marker-end="url(#a)"/>
    <line x1="190" y1="196" x2="370" y2="230" marker-end="url(#a)"/>
    <line x1="190" y1="256" x2="370" y2="260" marker-end="url(#a)"/>
    <line x1="190" y1="316" x2="370" y2="290" marker-end="url(#a)"/>
    <line x1="190" y1="370" x2="370" y2="320" marker-end="url(#a)"/>
  </g>

  <!-- Pico -->
  <rect x="370" y="170" width="220" height="190" rx="10" fill="#e8f6ec" stroke="#1e8449" stroke-width="2.5"/>
  <text x="480" y="210" text-anchor="middle" font-size="17" font-weight="bold" fill="#145a32">Raspberry Pi Pico</text>
  <text x="480" y="230" text-anchor="middle" fill="#145a32">RP2040 · Arduino core</text>
  <text x="480" y="262" text-anchor="middle" font-size="12" fill="#333">non-blocking state machine</text>
  <text x="480" y="280" text-anchor="middle" font-size="12" fill="#333">settings in flash (emulated EEPROM)</text>
  <text x="480" y="318" text-anchor="middle" font-size="12" fill="#333">GP4 SDA · GP5 SCL</text>
  <text x="480" y="336" text-anchor="middle" font-size="12" fill="#333">GP0 buzzer · GP8/9/10 outputs</text>

  <!-- I2C bus -->
  <line x1="480" y1="170" x2="480" y2="120" stroke="#2471a3" stroke-width="3"/>
  <line x1="300" y1="120" x2="930" y2="120" stroke="#2471a3" stroke-width="3"/>
  <text x="300" y="112" fill="#2471a3" font-size="12" font-weight="bold">I2C</text>
  <g>
    <line x1="555" y1="120" x2="555" y2="84" stroke="#2471a3" stroke-width="3"/>
    <rect x="470" y="44" width="170" height="40" rx="7" fill="#eaf2fb" stroke="#2471a3"/>
    <text x="555" y="61" text-anchor="middle" font-weight="bold">OLED SSD1306</text>
    <text x="555" y="77" text-anchor="middle" font-size="11.5">128×64 · 0x3C</text>


    <line x1="870" y1="120" x2="870" y2="80" stroke="#2471a3" stroke-width="3"/>
    <rect x="800" y="44" width="160" height="40" rx="7" fill="#eaf2fb" stroke="#2471a3"/>
    <text x="880" y="61" text-anchor="middle"><tspan font-weight="bold">LPS28DFW</tspan></text>
    <text x="880" y="77" text-anchor="middle" font-size="11.5">bag pressure · 0x5C/0x5D</text>
  </g>

  <!-- Outputs -->
  <text x="850" y="182" text-anchor="middle" font-weight="bold" fill="#555">OUTPUTS</text>
  <g>
    <rect x="660" y="196" width="100" height="40" rx="7" fill="#fdf2e9" stroke="#ca6f1e"/>
    <text x="710" y="215" text-anchor="middle" font-size="12">MOSFET</text><text x="710" y="230" text-anchor="middle" font-size="11">GP8</text>
    <rect x="800" y="196" width="160" height="40" rx="7" fill="#fbeee6" stroke="#ca6f1e" stroke-width="1.5"/>
    <text x="880" y="215" text-anchor="middle" font-weight="bold">Z1 – inlet valve</text><text x="880" y="230" text-anchor="middle" font-size="11">12 V, NC</text>

    <rect x="660" y="252" width="100" height="40" rx="7" fill="#fdf2e9" stroke="#ca6f1e"/>
    <text x="710" y="271" text-anchor="middle" font-size="12">MOSFET</text><text x="710" y="286" text-anchor="middle" font-size="11">GP9</text>
    <rect x="800" y="252" width="160" height="40" rx="7" fill="#fbeee6" stroke="#ca6f1e" stroke-width="1.5"/>
    <text x="880" y="271" text-anchor="middle" font-weight="bold">Z2 – outlet valve</text><text x="880" y="286" text-anchor="middle" font-size="11">12 V, NC</text>

    <rect x="660" y="308" width="100" height="40" rx="7" fill="#fdf2e9" stroke="#ca6f1e"/>
    <text x="710" y="327" text-anchor="middle" font-size="12">MOSFET</text><text x="710" y="342" text-anchor="middle" font-size="11">GP10</text>
    <rect x="800" y="308" width="160" height="40" rx="7" fill="#fbeee6" stroke="#ca6f1e" stroke-width="1.5"/>
    <text x="880" y="327" text-anchor="middle" font-weight="bold">Pump</text><text x="880" y="342" text-anchor="middle" font-size="11">12 V diaphragm</text>

    <rect x="660" y="364" width="280" height="34" rx="7" fill="#f4f6f7" stroke="#7f8c8d"/>
    <text x="800" y="386" text-anchor="middle"><tspan font-weight="bold">Passive buzzer</tspan> – GP0</text>
  </g>
  <g stroke="#444" stroke-width="2" fill="none">
    <line x1="590" y1="216" x2="660" y2="216" marker-end="url(#a)"/>
    <line x1="590" y1="272" x2="660" y2="272" marker-end="url(#a)"/>
    <line x1="590" y1="328" x2="660" y2="328" marker-end="url(#a)"/>
    <polyline points="590,348 630,348 630,381 660,381" marker-end="url(#a)"/>
    <line x1="760" y1="216" x2="800" y2="216"/>
    <line x1="760" y1="272" x2="800" y2="272"/>
    <line x1="760" y1="328" x2="800" y2="328"/>
  </g>

  <!-- Power -->
  <rect x="370" y="470" width="220" height="52" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="480" y="494" text-anchor="middle" font-weight="bold" fill="#922b21">12 V supply</text>
  <text x="480" y="512" text-anchor="middle" font-size="11.5" fill="#922b21">valves + pump + logic</text>
  <rect x="130" y="470" width="170" height="52" rx="10" fill="#fdedec" stroke="#c0392b"/>
  <text x="215" y="494" text-anchor="middle" font-weight="bold" fill="#922b21">Step-down → 5 V</text>
  <text x="215" y="512" text-anchor="middle" font-size="11.5" fill="#922b21">powers the Pico (VSYS)</text>
  <g stroke="#c0392b" stroke-width="2.5" fill="none">
    <line x1="370" y1="496" x2="300" y2="496" marker-end="url(#r)"/>
    <polyline points="215,470 215,440 440,440 440,360" marker-end="url(#r)"/>
    <polyline points="590,496 975,496 975,216"/>
    <line x1="975" y1="216" x2="962" y2="216" marker-end="url(#r)"/>
    <line x1="975" y1="272" x2="962" y2="272" marker-end="url(#r)"/>
    <line x1="975" y1="328" x2="962" y2="328" marker-end="url(#r)"/>
  </g>
  <text x="960" y="488" text-anchor="end" font-size="11.5" fill="#922b21">12 V to valves and pump</text>
  <text x="320" y="433" font-size="11.5" fill="#922b21">5 V</text>

  <text x="500" y="570" text-anchor="middle" font-size="11.5" fill="#777">Pin mapping from Firmware/flush-automation (Ui.cpp, Procedure.cpp).</text>
</svg>
