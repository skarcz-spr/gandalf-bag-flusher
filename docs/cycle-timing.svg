<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="400" fill="#fff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Output timing – one fill + empty cycle</text>

  <!-- phase backgrounds: x scale arbitrary (not to scale) -->
  <!-- segments: A act(130-190) FILL(190-390) P(390-450) A(450-510) EMPTY(510-830) P(830-890) -->
  <g>
    <rect x="130" y="60" width="60" height="260" fill="#f4f6f7"/>
    <rect x="190" y="60" width="200" height="260" fill="#e8f6ec"/>
    <rect x="390" y="60" width="60" height="260" fill="#f4f6f7"/>
    <rect x="450" y="60" width="60" height="260" fill="#f4f6f7"/>
    <rect x="510" y="60" width="320" height="260" fill="#fdf2e9"/>
    <rect x="830" y="60" width="60" height="260" fill="#f4f6f7"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#444">
    <text x="160" y="76">t_act</text>
    <text x="290" y="76" font-weight="bold" fill="#1e8449">FILL – fill_time</text>
    <text x="420" y="76">t_act</text>
    <text x="480" y="76">t_act</text>
    <text x="670" y="76" font-weight="bold" fill="#ca6f1e">EMPTY – until cutoff (max. empty_time)</text>
    <text x="860" y="76">t_act</text>
  </g>

  <!-- signal labels -->
  <g font-weight="bold" text-anchor="end">
    <text x="115" y="125">Z1</text>
    <text x="115" y="195">Z2</text>
    <text x="115" y="265">Pump</text>
  </g>
  <g font-size="10.5" fill="#888" text-anchor="end">
    <text x="115" y="140">GP8</text><text x="115" y="210">GP9</text><text x="115" y="280">GP10</text>
  </g>
  <!-- baselines -->
  <g stroke="#ccc" stroke-width="1"><line x1="125" y1="135" x2="930" y2="135"/><line x1="125" y1="205" x2="930" y2="205"/><line x1="125" y1="275" x2="930" y2="275"/></g>

  <!-- waveforms: high = -30 -->
  <polyline points="125,135 130,135 130,105 390,105 390,135 930,135" fill="none" stroke="#1e8449" stroke-width="3"/>
  <polyline points="125,205 450,205 450,175 830,175 830,205 930,205" fill="none" stroke="#ca6f1e" stroke-width="3"/>
  <polyline points="125,275 450,275 450,245 830,245 830,275 930,275" fill="none" stroke="#ca6f1e" stroke-width="3"/>

  <!-- cutoff -->
  <line x1="830" y1="95" x2="830" y2="330" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="830" y="346" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">cutoff detected</text>
  <text x="830" y="362" text-anchor="middle" font-size="11" fill="#c0392b">(bag pressure below threshold for M consecutive samples)</text>

  <text x="500" y="390" text-anchor="middle" font-size="11" fill="#888">Not to scale. t_act = actuation_time (default 500 ms). The procedure starts with one EMPTY phase (cycle 0), then repeats this cycle N times.</text>
</svg>
